<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EdiTrack — Storyboard Assistant</title>
<script src="https://cdn.tailwindcss.com"></script>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.383.0?external=react"
  }
}
</script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<style>
  html, body { background:#020617; margin:0; padding:0; }
  #root { min-height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-type="module" data-presets="react">
import React, { useState, useEffect, useRef } from 'react';
import ReactDOM from 'react-dom/client';
import {
  UploadCloud,
  CheckCircle2,
  Circle,
  Copy,
  Trash2,
  FileText,
  Image as ImageIcon,
  Video,
  Activity
} from 'lucide-react';

// ==========================================
// APLIKASI UTAMA
// ==========================================
function App() {
  const [projectData, setProjectData] = useState([]);
  const [completedScenes, setCompletedScenes] = useState(new Set());
  const [projectName, setProjectName] = useState("");
  const [isProcessing, setIsProcessing] = useState(false);
  const [toastMessage, setToastMessage] = useState("");
  const fileInputRef = useRef(null);

  // Load Mammoth.js dynamically for parsing .docx
  useEffect(() => {
    const script = document.createElement('script');
    script.src = "https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js";
    script.async = true;
    document.body.appendChild(script);

    // Load saved data from localStorage
    const savedProject = localStorage.getItem('storyboardProject');
    const savedCompleted = localStorage.getItem('completedScenes');
    const savedName = localStorage.getItem('projectName');

    if (savedProject) setProjectData(JSON.parse(savedProject));
    if (savedCompleted) setCompletedScenes(new Set(JSON.parse(savedCompleted)));
    if (savedName) setProjectName(savedName);

    return () => {
      document.body.removeChild(script);
    };
  }, []);

  // Save progress to localStorage whenever it changes
  useEffect(() => {
    if (projectData.length > 0) {
      localStorage.setItem('storyboardProject', JSON.stringify(projectData));
      localStorage.setItem('completedScenes', JSON.stringify(Array.from(completedScenes)));
      localStorage.setItem('projectName', projectName);
    } else {
      localStorage.removeItem('storyboardProject');
      localStorage.removeItem('completedScenes');
      localStorage.removeItem('projectName');
    }
  }, [projectData, completedScenes, projectName]);

  const showToast = (message) => {
    setToastMessage(message);
    setTimeout(() => setToastMessage(""), 2000);
  };

  const copyToClipboard = (text, label) => {
    // Menghapus tanda kutip ganda di awal dan akhir jika ada
    let cleanText = text.trim();
    if (cleanText.startsWith('"') && cleanText.endsWith('"')) {
      cleanText = cleanText.substring(1, cleanText.length - 1);
    }
    
    // Gunakan execCommand sebagai fallback untuk iframe
    const textArea = document.createElement("textarea");
    textArea.value = cleanText;
    document.body.appendChild(textArea);
    textArea.select();
    try {
      document.execCommand('copy');
      showToast(`✅ ${label} berhasil disalin!`);
    } catch (err) {
      console.error('Gagal mengcopy', err);
    }
    document.body.removeChild(textArea);
  };

  const toggleSceneCompletion = (sceneId) => {
    setCompletedScenes(prev => {
      const newSet = new Set(prev);
      if (newSet.has(sceneId)) {
        newSet.delete(sceneId);
      } else {
        newSet.add(sceneId);
      }
      return newSet;
    });
  };

  const clearProject = () => {
    if (window.confirm("Apakah Anda yakin ingin menghapus projek ini dan memulai yang baru? Semua progres akan hilang.")) {
      setProjectData([]);
      setCompletedScenes(new Set());
      setProjectName("");
    }
  };

  const handleFileUpload = (e) => {
    const file = e.target.files[0];
    if (!file) return;

    setProjectName(file.name.replace('.docx', ''));
    setIsProcessing(true);

    const reader = new FileReader();
    reader.onload = (event) => {
      const arrayBuffer = event.target.result;
      
      // Menggunakan mammoth untuk mengubah docx menjadi raw text
      if (window.mammoth) {
        window.mammoth.extractRawText({ arrayBuffer: arrayBuffer })
          .then((result) => {
            const text = result.value;
            parseDocument(text);
          })
          .catch((err) => {
            console.error("Error parsing docx:", err);
            alert("Gagal membaca file docx. Pastikan file valid.");
            setIsProcessing(false);
          });
      } else {
        alert("Sistem belum siap, mohon tunggu beberapa detik dan coba lagi.");
        setIsProcessing(false);
      }
    };
    reader.readAsArrayBuffer(file);
  };

  // Logic parsing yang disesuaikan dengan format dokumen Anda
  const parseDocument = (rawText) => {
    try {
      const scenes = [];
      let currentSkrip = "General";
      
      // Memecah teks berdasarkan kata "SCENE"
      const parts = rawText.split(/SCENE\s+(\d+)/i);
      
      // Deteksi Skrip di awal dokumen sebelum Scene 1
      const initialSkripMatch = parts[0].match(/SKRIP\s+(\d+)/i);
      if (initialSkripMatch) {
        currentSkrip = `SKRIP ${initialSkripMatch[1]}`;
      }

      for (let i = 1; i < parts.length; i += 2) {
        const sceneNum = parts[i];
        const sceneContent = parts[i + 1];
        
        // Deteksi jika di dalam konten scene terdapat pergantian SKRIP
        const skripMatch = sceneContent.match(/SKRIP\s+(\d+)/i);
        if (skripMatch) {
           // Simpan untuk scene berikutnya
           currentSkrip = `SKRIP ${skripMatch[1]}`;
        }

        // Ekstraksi data menggunakan regex
        const extractField = (regex, defaultVal = "") => {
          const match = sceneContent.match(regex);
          return match ? match[1].trim() : defaultVal;
        };

        const scriptEng = extractField(/Script:\s*(.*?)(?=Terjemahan:|Visual:|Kata Kunci Pencarian:|$)/is);
        const scriptId = extractField(/Terjemahan:\s*(.*?)(?=Visual:|Kata Kunci Pencarian:|$)/is);
        const visual = extractField(/Visual:\s*(.*?)(?=Kata Kunci Pencarian:|Prompt Motion Graphic:|Prompt Medical Animation:|$)/is);
        
        // Ekstrak kata kunci dan prompt
        const kataKunci = extractField(/Kata Kunci Pencarian:\s*(.*?)(?=Prompt Motion Graphic:|Prompt Medical Animation:|SKRIP|SCENE|$)/is);
        const promptMG = extractField(/Prompt Motion Graphic:\s*(.*?)(?=Prompt Medical Animation:|SKRIP|SCENE|$)/is);
        const promptMA = extractField(/Prompt Medical Animation:\s*(.*?)(?=SKRIP|SCENE|$)/is);

        // Hanya tambahkan jika ada konten skrip atau visual
        if (scriptEng || scriptId || visual || kataKunci) {
          scenes.push({
            id: `scene-${sceneNum}-${Date.now()}`,
            sceneNum: sceneNum,
            skrip: currentSkrip,
            scriptEng,
            scriptId,
            visual,
            kataKunci,
            promptMG,
            promptMA
          });
        }
      }

      setProjectData(scenes);
      setCompletedScenes(new Set());
    } catch (error) {
      console.error("Parsing error:", error);
      alert("Terjadi kesalahan saat memproses isi dokumen. Pastikan format sesuai standar.");
    } finally {
      setIsProcessing(false);
      if (fileInputRef.current) fileInputRef.current.value = '';
    }
  };

  // ==========================================
  // RENDER UI
  // ==========================================
  return (
    <div className="min-h-screen bg-slate-950 text-slate-200 font-sans selection:bg-indigo-500/30">
      
      {/* Toast Notification */}
      {toastMessage && (
        <div className="fixed top-5 left-1/2 -translate-x-1/2 z-50 bg-indigo-600 text-white px-6 py-3 rounded-full shadow-lg shadow-indigo-500/20 font-medium text-sm transition-all animate-bounce">
          {toastMessage}
        </div>
      )}

      {/* Header Sticky */}
      <header className="sticky top-0 z-40 bg-slate-900/80 backdrop-blur-md border-b border-slate-800 p-4 shadow-sm">
        <div className="max-w-3xl mx-auto flex items-center justify-between">
          <div>
            <h1 className="text-xl font-bold bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">
              EdiTrack
            </h1>
            <p className="text-xs text-slate-400 font-medium">Storyboard Assistant</p>
          </div>
          
          {projectData.length > 0 && (
            <button 
              onClick={clearProject}
              className="flex items-center gap-2 px-3 py-2 text-xs font-semibold text-rose-400 hover:text-rose-300 hover:bg-rose-500/10 rounded-lg transition-colors"
            >
              <Trash2 size={14} />
              <span className="hidden sm:inline">Ganti Projek</span>
            </button>
          )}
        </div>
      </header>

      <main className="max-w-3xl mx-auto p-4 pb-24">
        
        {/* State: Belum ada Projek */}
        {projectData.length === 0 ? (
          <div className="mt-20 flex flex-col items-center justify-center text-center p-8 border-2 border-dashed border-slate-800 rounded-3xl bg-slate-900/50">
            <div className="w-20 h-20 bg-indigo-500/10 rounded-full flex items-center justify-center mb-6">
              <UploadCloud size={40} className="text-indigo-400" />
            </div>
            <h2 className="text-2xl font-bold text-white mb-2">Mulai Editing Baru</h2>
            <p className="text-slate-400 mb-8 max-w-sm text-sm leading-relaxed">
              Upload file <span className="text-indigo-300 font-semibold">.docx</span> storyboard Anda. Sistem akan otomatis memecahnya per scene agar mudah dicopy dan dilacak.
            </p>
            
            <input 
              type="file" 
              accept=".docx" 
              ref={fileInputRef}
              onChange={handleFileUpload}
              className="hidden" 
              id="file-upload"
            />
            <label 
              htmlFor="file-upload" 
              className="cursor-pointer bg-indigo-600 hover:bg-indigo-500 text-white px-8 py-4 rounded-2xl font-semibold shadow-lg shadow-indigo-500/25 transition-all active:scale-95 flex items-center gap-2"
            >
              {isProcessing ? (
                <>Sedang Memproses...</>
              ) : (
                <>
                  <FileText size={20} />
                  Pilih File .docx
                </>
              )}
            </label>
          </div>
        ) : (
          
          /* State: Projek Aktif */
          <div className="space-y-6 mt-4">
            
            {/* Project Info & Progress */}
            <div className="bg-slate-900 rounded-3xl p-5 border border-slate-800 shadow-sm">
              <h2 className="text-lg font-bold text-white mb-1 truncate">{projectName || "Untitled Project"}</h2>
              <div className="flex items-center justify-between text-sm text-slate-400 mb-3">
                <span>Progress Editing</span>
                <span className="font-semibold text-indigo-400">
                  {completedScenes.size} / {projectData.length} Scene Selesai
                </span>
              </div>
              {/* Progress Bar */}
              <div className="w-full bg-slate-800 rounded-full h-2.5 overflow-hidden">
                <div 
                  className="bg-gradient-to-r from-indigo-500 to-cyan-400 h-2.5 rounded-full transition-all duration-500 ease-out"
                  style={{ width: `${(completedScenes.size / projectData.length) * 100}%` }}
                ></div>
              </div>
            </div>

            {/* List Scene */}
            <div className="space-y-4">
              {projectData.map((scene, index) => {
                const isCompleted = completedScenes.has(scene.id);
                
                return (
                  <div 
                    key={scene.id} 
                    className={`relative overflow-hidden transition-all duration-300 rounded-3xl border ${
                      isCompleted 
                        ? 'bg-slate-900/40 border-slate-800/50 opacity-75 grayscale-[20%]' 
                        : 'bg-slate-900 border-slate-700 shadow-xl shadow-black/20'
                    }`}
                  >
                    {/* Header Scene */}
                    <div 
                      className="p-4 border-b border-slate-800 flex items-center justify-between cursor-pointer"
                      onClick={() => toggleSceneCompletion(scene.id)}
                    >
                      <div className="flex items-center gap-3">
                        <button className="text-slate-400 hover:text-indigo-400 transition-colors focus:outline-none">
                          {isCompleted ? (
                            <CheckCircle2 size={24} className="text-emerald-400" />
                          ) : (
                            <Circle size={24} />
                          )}
                        </button>
                        <div>
                          <div className="text-xs font-bold text-indigo-400 tracking-wider uppercase">
                            {scene.skrip}
                          </div>
                          <h3 className={`text-lg font-bold ${isCompleted ? 'text-slate-400 line-through decoration-slate-600' : 'text-white'}`}>
                            Scene {scene.sceneNum}
                          </h3>
                        </div>
                      </div>
                      
                      {/* Visual Badge */}
                      {scene.visual && (
                        <div className="hidden sm:flex items-center gap-1.5 px-3 py-1 bg-slate-800 rounded-full text-xs font-medium text-slate-300 max-w-[150px]">
                           {scene.visual.toLowerCase().includes('motion') ? <Video size={12}/> : 
                            scene.visual.toLowerCase().includes('medical') ? <Activity size={12}/> : 
                            <ImageIcon size={12}/>}
                           <span className="truncate">{scene.visual.split('-')[0]}</span>
                        </div>
                      )}
                    </div>

                    {/* Konten Scene */}
                    <div className="p-4 space-y-5">
                      
                      {/* Narasi */}
                      {(scene.scriptEng || scene.scriptId) && (
                        <div className="space-y-2">
                          <h4 className="text-xs font-semibold text-slate-500 uppercase tracking-wider">Narasi (Script)</h4>
                          <div className="bg-slate-950/50 p-4 rounded-2xl border border-slate-800">
                            {scene.scriptEng && (
                              <p className="text-slate-300 italic mb-2 text-sm leading-relaxed">"{scene.scriptEng}"</p>
                            )}
                            {scene.scriptId && (
                              <p className="text-slate-100 text-[15px] leading-relaxed">{scene.scriptId}</p>
                            )}
                          </div>
                        </div>
                      )}

                      {/* AREA TOMBOL COPY KHUSUS */}
                      <div className="space-y-3 pt-2">
                        <h4 className="text-xs font-semibold text-slate-500 uppercase tracking-wider">Bahan Visual</h4>
                        
                        {/* Tombol Kata Kunci */}
                        {scene.kataKunci && (
                          <div className="flex gap-2">
                            <button 
                              onClick={() => copyToClipboard(scene.kataKunci, "Kata Kunci")}
                              className="flex-1 flex items-center justify-between bg-slate-800 hover:bg-slate-700 active:bg-slate-600 px-4 py-3 rounded-2xl transition-colors border border-slate-700 group"
                            >
                              <div className="flex flex-col items-start text-left">
                                <span className="text-[10px] text-cyan-400 font-bold uppercase mb-0.5">Footage Keyword</span>
                                <span className="text-sm font-medium text-white line-clamp-1">{scene.kataKunci}</span>
                              </div>
                              <div className="bg-slate-700 group-hover:bg-indigo-500 p-2 rounded-xl transition-colors">
                                <Copy size={16} className="text-slate-300 group-hover:text-white" />
                              </div>
                            </button>
                          </div>
                        )}

                        {/* Prompt Generative */}
                        {(scene.promptMG || scene.promptMA) && (
                          <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                            {scene.promptMG && (
                              <button 
                                onClick={() => copyToClipboard(scene.promptMG, "Prompt Motion Graphic")}
                                className="flex items-center justify-between bg-indigo-900/20 hover:bg-indigo-900/40 active:bg-indigo-900/60 px-4 py-3 rounded-2xl transition-colors border border-indigo-500/20 group"
                              >
                                <div className="flex flex-col items-start text-left pr-2">
                                  <span className="text-[10px] text-indigo-300 font-bold uppercase mb-0.5 flex items-center gap-1">
                                    <Video size={10} /> Motion Graphic
                                  </span>
                                  <span className="text-sm font-medium text-indigo-50 line-clamp-1">{scene.promptMG}</span>
                                </div>
                                <div className="bg-indigo-500/20 group-hover:bg-indigo-500 p-2 rounded-xl transition-colors shrink-0">
                                  <Copy size={16} className="text-indigo-300 group-hover:text-white" />
                                </div>
                              </button>
                            )}

                            {scene.promptMA && (
                              <button 
                                onClick={() => copyToClipboard(scene.promptMA, "Prompt Medical Animation")}
                                className="flex items-center justify-between bg-purple-900/20 hover:bg-purple-900/40 active:bg-purple-900/60 px-4 py-3 rounded-2xl transition-colors border border-purple-500/20 group"
                              >
                                <div className="flex flex-col items-start text-left pr-2">
                                  <span className="text-[10px] text-purple-300 font-bold uppercase mb-0.5 flex items-center gap-1">
                                    <Activity size={10} /> Med. Animation
                                  </span>
                                  <span className="text-sm font-medium text-purple-50 line-clamp-1">{scene.promptMA}</span>
                                </div>
                                <div className="bg-purple-500/20 group-hover:bg-purple-500 p-2 rounded-xl transition-colors shrink-0">
                                  <Copy size={16} className="text-purple-300 group-hover:text-white" />
                                </div>
                              </button>
                            )}
                          </div>
                        )}
                      </div>

                    </div>
                  </div>
                );
              })}
            </div>
            
            <div className="text-center pb-8 pt-4">
              <p className="text-xs text-slate-500">Semua progres tersimpan otomatis di perangkat Anda.</p>
            </div>

          </div>
        )}
      </main>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
