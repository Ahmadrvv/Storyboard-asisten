<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script>
(function(){
  function show(msg){
    var d=document.getElementById('err-overlay');
    if(!d){d=document.createElement('div');d.id='err-overlay';
      d.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#7f1d1d;color:#fff;font:12px/1.4 monospace;padding:10px;white-space:pre-wrap;max-height:50vh;overflow:auto';
      (document.body||document.documentElement).appendChild(d);}
    d.textContent+=msg+'\n';
  }
  window.addEventListener('error',function(e){show('Error: '+(e.message||'tidak diketahui')+(e.lineno?' (baris '+e.lineno+')':''));});
  window.addEventListener('unhandledrejection',function(e){show('Error: '+((e.reason&&e.reason.message)||e.reason));});
})();
</script>
<title>Storyboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.7/babel.min.js"></script>
<style>
  html, body { background:#000000; margin:0; padding:0; }
  #root { min-height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

const makeIcon = (paths) => ({ size = 24, className = '' }) => (
  <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{paths}</svg>
);
const UploadCloud = makeIcon(<><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M12 12v9"/><path d="m16 16-4-4-4 4"/></>);
const CheckCircle2 = makeIcon(<><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></>);
const Circle = makeIcon(<circle cx="12" cy="12" r="10"/>);
const Copy = makeIcon(<><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></>);
const Trash2 = makeIcon(<><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></>);
const FileText = makeIcon(<><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></>);
const ImageIcon = makeIcon(<><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></>);
const Video = makeIcon(<><path d="m22 8-6 4 6 4V8Z"/><rect width="14" height="12" x="2" y="6" rx="2" ry="2"/></>);
const Activity = makeIcon(<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>);
const ChevronDown = makeIcon(<path d="m6 9 6 6 6-6"/>);
const ChevronUp = makeIcon(<path d="m18 15-6-6-6 6"/>);
const Layers = makeIcon(<><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/></>);

// Penyimpanan lokal yang aman (tidak error jika diblokir, mis. di preview)
const store = {
  get: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} },
  remove: (k) => { try { localStorage.removeItem(k); } catch (e) {} }
};
const safeParse = (v, fallback) => { try { return JSON.parse(v); } catch (e) { return fallback; } };

function App() {
  const [projectData, setProjectData] = useState({});
  const [scriptList, setScriptList] = useState([]);
  const [completedScenes, setCompletedScenes] = useState(new Set());
  const [expandedScripts, setExpandedScripts] = useState(new Set());
  const [projectName, setProjectName] = useState("");
  const [isProcessing, setIsProcessing] = useState(false);
  const [toastMessage, setToastMessage] = useState("");
  const fileInputRef = useRef(null);

  // Muat data tersimpan
  useEffect(() => {
    const savedProject = store.get('storyboardProjectGrouped');
    const savedScriptList = store.get('storyboardScriptList');
    const savedCompleted = store.get('completedScenes');
    const savedName = store.get('projectName');

    if (savedProject) setProjectData(safeParse(savedProject, {}));
    if (savedScriptList) setScriptList(safeParse(savedScriptList, []));
    if (savedCompleted) setCompletedScenes(new Set(safeParse(savedCompleted, [])));
    if (savedName) setProjectName(savedName);

  }, []);

  useEffect(() => {
    if (scriptList.length > 0) {
      store.set('storyboardProjectGrouped', JSON.stringify(projectData));
      store.set('storyboardScriptList', JSON.stringify(scriptList));
      store.set('completedScenes', JSON.stringify(Array.from(completedScenes)));
      store.set('projectName', projectName);
    } else {
      store.remove('storyboardProjectGrouped');
      store.remove('storyboardScriptList');
      store.remove('completedScenes');
      store.remove('projectName');
    }
  }, [projectData, scriptList, completedScenes, projectName]);

  const showToast = (message) => {
    setToastMessage(message);
    setTimeout(() => setToastMessage(""), 2000);
  };

  const copyToClipboard = (text, label) => {
    let cleanText = text.trim();
    if (cleanText.startsWith('"') && cleanText.endsWith('"')) {
      cleanText = cleanText.substring(1, cleanText.length - 1);
    }
    
    // Perbaikan Paste Line Break (Enter) tetap dipertahankan dari versi sebelumnya
    cleanText = cleanText.replace(/(\r\n|\n|\r)/gm, " "); 
    cleanText = cleanText.replace(/\s+/g, " ").trim();    
    
    const fallbackCopy = () => {
      const textArea = document.createElement("textarea");
      textArea.value = cleanText;
      textArea.style.position = "fixed";
      textArea.style.opacity = "0";
      document.body.appendChild(textArea);
      textArea.focus();
      textArea.select();
      textArea.setSelectionRange(0, cleanText.length);
      try {
        document.execCommand('copy');
        showToast(`✅ ${label} disalin!`);
      } catch (err) {
        console.error('Gagal mengcopy', err);
        showToast(`❌ Gagal menyalin ${label}`);
      }
      document.body.removeChild(textArea);
    };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(cleanText)
        .then(() => showToast(`✅ ${label} disalin!`))
        .catch(fallbackCopy);
    } else {
      fallbackCopy();
    }
  };

  const toggleSceneCompletion = (sceneId, e) => {
    if (e) e.stopPropagation();
    setCompletedScenes(prev => {
      const newSet = new Set(prev);
      if (newSet.has(sceneId)) {
        newSet.delete(sceneId);
      } else {
        newSet.add(sceneId);
      }
      return newSet;
    });
  };

  const toggleScriptCompletion = (scriptName, scenesInScript, e) => {
    if (e) e.stopPropagation();
    
    const sceneIds = scenesInScript.map(s => s.id);
    const allCompleted = sceneIds.every(id => completedScenes.has(id));

    setCompletedScenes(prev => {
      const newSet = new Set(prev);
      if (allCompleted) {
        sceneIds.forEach(id => newSet.delete(id));
      } else {
        sceneIds.forEach(id => newSet.add(id));
      }
      return newSet;
    });
  };

  const toggleExpandScript = (scriptName) => {
    setExpandedScripts(prev => {
      const newSet = new Set(prev);
      if (newSet.has(scriptName)) {
        newSet.delete(scriptName);
      } else {
        newSet.add(scriptName);
      }
      return newSet;
    });
  };

  const clearProject = () => {
    if (window.confirm("Hapus projek ini dan mulai yang baru? Semua progres akan hilang.")) {
      setProjectData({});
      setScriptList([]);
      setCompletedScenes(new Set());
      setExpandedScripts(new Set());
      setProjectName("");
    }
  };

  const handleFileUpload = (e) => {
    const file = e.target.files[0];
    if (!file) return;

    setProjectName(file.name.replace(/\.(md|markdown|txt)$/i, ''));
    setIsProcessing(true);

    const reader = new FileReader();
    reader.onload = (event) => {
      parseDocument(String(event.target.result || ''));
    };
    reader.onerror = () => {
      alert("Gagal membaca file. Pastikan file .md valid.");
      setIsProcessing(false);
    };
    reader.readAsText(file, 'UTF-8');
  };

  const FIELDS = ['Script', 'Terjemahan', 'Visual', 'Durasi Narasi', 'Durasi Generate', 'Kata Kunci Pencarian', 'Kata Kunci Gambar', 'Kata Kunci Visual', 'Teks', 'Judul', 'Subtitle', 'Prompt AI'];
  const stripQuotes = (v) => v.trim().replace(/^"+|"+$/g, '').trim();

  const parseDocument = (rawText) => {
    try {
      let cleanText = rawText.replace(/\r\n?/g, '\n');
      // Bagian penutup (ringkasan credit, catatan) tidak dibaca
      const endMatch = cleanText.match(/^#{1,3}\s*(RINGKASAN CREDIT|CATATAN NASKAH|POST-PROCESSING CHECK)/im);
      if (endMatch) cleanText = cleanText.substring(0, endMatch.index);

      const FIELD_RE = new RegExp('^\\s*(' + FIELDS.join('|') + ')\\s*:\\s*(.*)$', 'i');
      const SKRIP_RE = /^#{1,3}\s*SKRIP\s+(\d+)\s*(?:\(([^)]*)\))?/i;
      const SCENE_RE = /^\s*(?:\*\*)?SCENE\s+(\d+)(?:\*\*)?\s*:?\s*$/i;

      const grouped = {};
      const scriptsArr = [];
      let currentSkrip = null;
      let currentKategori = "";
      let scene = null;
      let lastField = null;

      const pushScene = () => {
        if (scene && currentSkrip) {
          const f = scene.fields;
          const gambar = (f['Kata Kunci Gambar'] || '').trim().replace(/^"|"$/g, '').split(/"\s*\/\s*"/).map(x => x.trim()).filter(Boolean);
          if (!grouped[currentSkrip]) {
            grouped[currentSkrip] = [];
            scriptsArr.push(currentSkrip);
          }
          grouped[currentSkrip].push({
            id: `scene-${currentSkrip.replace(/\D/g, '')}-${scene.num}`,
            sceneNum: scene.num,
            skrip: currentSkrip,
            kategori: currentKategori,
            scriptEng: stripQuotes(f['Script'] || ''),
            scriptId: stripQuotes(f['Terjemahan'] || ''),
            visual: (f['Visual'] || '').trim(),
            durasiNarasi: (f['Durasi Narasi'] || '').trim(),
            durasiGenerate: (f['Durasi Generate'] || '').trim(),
            kataKunci: stripQuotes(f['Kata Kunci Pencarian'] || ''),
            kataKunciGambar: gambar,
            kataKunciVisual: stripQuotes(f['Kata Kunci Visual'] || ''),
            teks: stripQuotes(f['Teks'] || ''),
            judul: stripQuotes(f['Judul'] || ''),
            subtitle: stripQuotes(f['Subtitle'] || ''),
            promptAI: stripQuotes(f['Prompt AI'] || '')
          });
        }
        scene = null;
        lastField = null;
      };

      for (const line of cleanText.split('\n')) {
        const skripMatch = line.match(SKRIP_RE);
        if (skripMatch) {
          pushScene();
          currentSkrip = `SKRIP ${skripMatch[1]}`;
          currentKategori = (skripMatch[2] || '').trim();
          continue;
        }
        const sceneMatch = line.match(SCENE_RE);
        if (sceneMatch) {
          pushScene();
          scene = { num: sceneMatch[1], fields: {} };
          continue;
        }
        if (!scene) continue;
        if (line.trim() === '---') { pushScene(); continue; }
        const fm = line.match(FIELD_RE);
        if (fm) {
          const key = FIELDS.find(n => n.toLowerCase() === fm[1].toLowerCase());
          scene.fields[key] = fm[2].trim();
          lastField = key;
        } else if (lastField && line.trim()) {
          scene.fields[lastField] += ' ' + line.trim();
        }
      }
      pushScene();

      if (scriptsArr.length === 0) {
        alert("Tidak ada SKRIP/SCENE yang terbaca. Periksa format file .md.");
        return;
      }

      setProjectData(grouped);
      setScriptList(scriptsArr);
      setCompletedScenes(new Set());
      setExpandedScripts(new Set([scriptsArr[0]]));
    } catch (error) {
      console.error("Parsing error:", error);
      alert("Terjadi kesalahan saat memproses isi dokumen.");
    } finally {
      setIsProcessing(false);
      if (fileInputRef.current) fileInputRef.current.value = '';
    }
  };

  const renderVisualIcon = (visual) => {
    const v = visual.toLowerCase();
    if (v.includes('lower third')) return <FileText size={10}/>;
    if (v.includes('+ ai')) return <Activity size={10}/>;
    if (v.includes('mechanic')) return <Layers size={10}/>;
    if (v.includes('stock')) return <Video size={10}/>;
    return <ImageIcon size={10}/>;
  };

  const renderTeks = (teks) => teks.split('**').map((part, i) => (
    i % 2 ? <span key={i} className="text-white font-bold">{part}</span> : part
  ));

  const renderFullCopy = (key, value, caption, copyValue) => (
    <button
      key={key}
      onClick={() => copyToClipboard(copyValue !== undefined ? copyValue : value, caption)}
      className="w-full flex items-center justify-between bg-neutral-900 hover:bg-neutral-800 px-3.5 py-2.5 rounded-xl transition-all border border-neutral-800 hover:border-neutral-700 group"
    >
      <div className="flex flex-col items-start text-left min-w-0">
        <span className="text-[9px] text-neutral-400 font-bold uppercase mb-0.5">{caption}</span>
        <span className="text-xs font-medium text-neutral-200 line-clamp-1">{value}</span>
      </div>
      <div className="bg-black border border-neutral-800 group-hover:bg-white group-hover:border-white p-1.5 rounded-lg transition-colors shrink-0">
        <Copy size={12} className="text-neutral-400 group-hover:text-black" />
      </div>
    </button>
  );

  const renderHalfCopy = (key, value, caption) => (
    <button
      key={key}
      onClick={() => copyToClipboard(value, caption)}
      className="flex items-center justify-between bg-neutral-900 hover:bg-neutral-800 px-3 py-2.5 rounded-xl transition-all border border-neutral-800 hover:border-neutral-700 group"
    >
      <div className="flex flex-col items-start text-left pr-2 min-w-0">
        <span className="text-[8px] text-neutral-400 font-bold uppercase mb-0.5 flex items-center gap-1">
          <FileText size={9} /> {caption}
        </span>
        <span className="text-xs font-medium text-neutral-200 line-clamp-1">{value}</span>
      </div>
      <div className="bg-black border border-neutral-800 group-hover:bg-white group-hover:border-white p-1.5 rounded-lg transition-colors shrink-0">
        <Copy size={12} className="text-neutral-400 group-hover:text-black" />
      </div>
    </button>
  );

  const totalAllScenes = Object.values(projectData).reduce((acc, curr) => acc + curr.length, 0);
  const totalCompleted = completedScenes.size;
  const percentage = totalAllScenes > 0 ? Math.round((totalCompleted / totalAllScenes) * 100) : 0;

  return (
    <div className="min-h-screen bg-black text-neutral-300 font-sans selection:bg-neutral-800">
      
      {toastMessage && (
        <div className="fixed top-6 left-1/2 -translate-x-1/2 z-50 bg-neutral-800 text-white px-5 py-2.5 rounded-full shadow-2xl border border-neutral-700 font-medium text-sm transition-all animate-in fade-in slide-in-from-top-5">
          {toastMessage}
        </div>
      )}

      <header className="sticky top-0 z-40 bg-black/80 backdrop-blur-xl border-b border-neutral-900 p-4">
        <div className="max-w-3xl mx-auto flex items-center justify-between">
          <div>
            <h1 className="text-xl font-bold text-white tracking-tight">
              Storyboard.
            </h1>
          </div>
          
          {scriptList.length > 0 && (
            <button 
              onClick={clearProject}
              className="flex items-center gap-2 px-3 py-1.5 text-xs font-semibold text-neutral-400 hover:text-white bg-neutral-900 hover:bg-neutral-800 border border-neutral-800 rounded-lg transition-all"
            >
              <Trash2 size={14} />
              <span className="hidden sm:inline">Ganti Projek</span>
            </button>
          )}
        </div>
      </header>

      <main className="max-w-3xl mx-auto p-4 pb-24">
        {scriptList.length === 0 ? (
          <div className="mt-20 flex flex-col items-center justify-center text-center p-8 rounded-3xl border border-neutral-800 bg-[#0a0a0a]">
            <div className="w-16 h-16 bg-neutral-900 rounded-full flex items-center justify-center mb-6 border border-neutral-800">
              <UploadCloud size={28} className="text-neutral-400" />
            </div>
            <h2 className="text-2xl font-bold text-white mb-2">Import Storyboard</h2>
            <p className="text-neutral-500 mb-8 max-w-sm text-sm">
              Upload file .md Anda untuk mengelompokkan skrip dan scene secara otomatis.
            </p>
            
            <input 
              type="file" 
              accept=".md,.markdown,.txt,text/markdown,text/plain" 
              ref={fileInputRef}
              onChange={handleFileUpload}
              className="hidden" 
              id="file-upload"
            />
            <label 
              htmlFor="file-upload" 
              className="cursor-pointer bg-white hover:bg-neutral-200 text-black px-8 py-3.5 rounded-xl font-semibold transition-all active:scale-95 flex items-center gap-2"
            >
              {isProcessing ? (
                <span className="animate-pulse">Memproses...</span>
              ) : (
                <>
                  <FileText size={18} />
                  Pilih File .md
                </>
              )}
            </label>
          </div>
        ) : (
          <div className="space-y-6 mt-2">
            
            <div className="bg-[#0a0a0a] rounded-2xl p-5 border border-neutral-900">
              <div className="flex items-center justify-between mb-2">
                <h2 className="text-base font-bold text-white truncate max-w-[200px] sm:max-w-md">{projectName}</h2>
                <span className="text-lg font-extrabold text-white">{percentage}%</span>
              </div>
              <div className="flex items-center justify-between text-xs text-neutral-500 mb-3">
                <span>Total Progres Selesai</span>
                <span>{totalCompleted} dari {totalAllScenes} Scene</span>
              </div>
              <div className="w-full bg-neutral-900 rounded-full h-2 overflow-hidden">
                <div 
                  className="bg-white h-2 rounded-full transition-all duration-500 ease-out"
                  style={{ width: `${percentage}%` }}
                ></div>
              </div>
            </div>

            <div className="space-y-4">
              {scriptList.map((scriptName) => {
                const scenesInScript = projectData[scriptName] || [];
                const isExpanded = expandedScripts.has(scriptName);
                
                const scriptSceneIds = scenesInScript.map(s => s.id);
                const isAllScriptCompleted = scriptSceneIds.length > 0 && scriptSceneIds.every(id => completedScenes.has(id));
                const completedCountInScript = scriptSceneIds.filter(id => completedScenes.has(id)).length;

                return (
                  <div 
                    key={scriptName} 
                    className="bg-[#0a0a0a] border border-neutral-800 rounded-2xl overflow-hidden shadow-lg transition-all"
                  >
                    <div 
                      onClick={() => toggleExpandScript(scriptName)}
                      className="p-4 sm:p-5 flex items-center justify-between cursor-pointer hover:bg-neutral-900/40 transition-colors"
                    >
                      <div className="flex items-center gap-3.5">
                        <button 
                          onClick={(e) => toggleScriptCompletion(scriptName, scenesInScript, e)}
                          className="text-neutral-600 focus:outline-none"
                        >
                          {isAllScriptCompleted ? (
                            <CheckCircle2 size={24} className="text-emerald-500" />
                          ) : (
                            <Circle size={24} className="hover:text-white transition-colors" />
                          )}
                        </button>
                        
                        <div>
                          <div className="flex items-center gap-2">
                            <Layers size={14} className="text-neutral-500" />
                            <span className="text-xs font-bold text-neutral-400 uppercase tracking-widest">{scriptName}{scenesInScript[0] && scenesInScript[0].kategori ? ` · ${scenesInScript[0].kategori}` : ''}</span>
                          </div>
                          <h3 className="text-base font-bold text-white mt-0.5">
                            {scriptName} <span className="text-xs font-normal text-neutral-500 ml-1">({completedCountInScript}/{scenesInScript.length} Scene)</span>
                          </h3>
                        </div>
                      </div>

                      <div className="flex items-center gap-2">
                        <div className="text-xs font-medium px-2.5 py-1 bg-neutral-900 border border-neutral-800 rounded-lg text-neutral-400">
                          {Math.round((completedCountInScript / scenesInScript.length) * 100 || 0)}%
                        </div>
                        <button className="text-neutral-500 p-1">
                          {isExpanded ? <ChevronUp size={20} /> : <ChevronDown size={20} />}
                        </button>
                      </div>
                    </div>

                    {isExpanded && (
                      <div className="border-t border-neutral-900 p-3 sm:p-4 space-y-3 bg-black/40">
                        {scenesInScript.map((scene) => {
                          const isSceneCompleted = completedScenes.has(scene.id);

                          return (
                            <div 
                              key={scene.id}
                              className={`rounded-xl border transition-all ${
                                isSceneCompleted 
                                  ? 'bg-black/40 border-neutral-900 opacity-50' 
                                  : 'bg-neutral-950 border-neutral-800/80 shadow-md'
                              }`}
                            >
                              <div 
                                className="p-3.5 border-b border-neutral-900/60 flex items-center justify-between cursor-pointer hover:bg-neutral-900/20"
                                onClick={(e) => toggleSceneCompletion(scene.id, e)}
                              >
                                <div className="flex items-center gap-3">
                                  <button className="text-neutral-600 focus:outline-none">
                                    {isSceneCompleted ? (
                                      <CheckCircle2 size={20} className="text-emerald-500" />
                                    ) : (
                                      <Circle size={20} className="hover:text-white transition-colors" />
                                    )}
                                  </button>
                                  <span className={`text-sm font-bold ${isSceneCompleted ? 'text-neutral-500 line-through' : 'text-neutral-200'}`}>
                                    Scene {scene.sceneNum}
                                  </span>
                                </div>

                                {scene.visual && (
                                  <div className="flex items-center gap-1.5 px-2 py-0.5 bg-neutral-900 border border-neutral-800 rounded text-[10px] font-medium text-neutral-400 max-w-[140px]">
                                     {renderVisualIcon(scene.visual)}
                                     <span className="truncate">{scene.visual.split('-')[0]}</span>
                                  </div>
                                )}
                              </div>

                              <div className="p-3.5 space-y-4">
                                {(scene.scriptEng || scene.scriptId) && (
                                  <div className="space-y-1.5">
                                    <div className="flex items-center justify-between">
                                      <h5 className="text-[9px] font-bold text-neutral-600 uppercase tracking-widest">Narasi</h5>
                                      {(scene.durasiNarasi || scene.durasiGenerate) && (
                                        <span className="text-[9px] text-neutral-600">
                                          {scene.durasiNarasi && `Narasi ${scene.durasiNarasi}`}{scene.durasiNarasi && scene.durasiGenerate && ' · '}{scene.durasiGenerate && `Generate ${scene.durasiGenerate}`}
                                        </span>
                                      )}
                                    </div>
                                    <div className="bg-black p-3 rounded-lg border border-neutral-900">
                                      {scene.scriptEng && (
                                        <p className="text-neutral-400 italic mb-1.5 text-xs leading-relaxed">"{scene.scriptEng}"</p>
                                      )}
                                      {scene.scriptId && (
                                        <p className="text-neutral-200 text-xs leading-relaxed">{scene.scriptId}</p>
                                      )}
                                    </div>
                                  </div>
                                )}

                                <div className="space-y-2 pt-0.5">
                                  <h5 className="text-[9px] font-bold text-neutral-600 uppercase tracking-widest">Prompt & Keyword</h5>
                                  
                                  {scene.kataKunci && renderFullCopy('kk', scene.kataKunci, "Footage Keyword")}
                                  {(scene.kataKunciGambar || []).map((k, i) => renderFullCopy(`kg-${i}`, k, `Image Keyword ${i + 1}`))}
                                  {scene.kataKunciVisual && renderFullCopy('kv', scene.kataKunciVisual, "Visual Keyword")}
                                  {(scene.judul || scene.subtitle) && (
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                      {scene.judul && renderHalfCopy('jd', scene.judul, "Judul")}
                                      {scene.subtitle && renderHalfCopy('sb', scene.subtitle, "Subtitle")}
                                    </div>
                                  )}
                                  {scene.teks && renderFullCopy('tk', renderTeks(scene.teks), "Teks", scene.teks.replace(/\*\*/g, ''))}
                                  {scene.promptAI && renderFullCopy('pa', scene.promptAI, "Prompt AI")}
                                </div>

                              </div>
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
            
            <div className="text-center pb-8 pt-6">
              <p className="text-[11px] text-neutral-600">Disimpan secara lokal di perangkat Anda.</p>
            </div>

          </div>
        )}
      </main>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
