<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storyboard Loader Professional</title>
    
    <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    colors: {
                        ui: {
                            bg: '#000000',          // Pure Black OLED background
                            card: '#090d16',        // Extremely refined deep professional card background
                            cardHover: '#0e1422',   // Hover state card
                            border: '#1b2333',      // Subtle high-end professional border
                            borderHover: '#2a364f', // Border hover
                            text: '#f1f5f9',        // Slate-100 crisp text
                            muted: '#94a3b8',       // Slate-400 muted text
                            accent: '#3b82f6',      // Professional Blue-500 accent
                            accentHover: '#2563eb', // Blue-600
                        }
                    },
                    boxShadow: {
                        'pro': '0 4px 24px -2px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.03)',
                        'pro-hover': '0 10px 32px -4px rgba(59, 130, 246, 0.12), 0 0 0 1px rgba(59, 130, 246, 0.15)',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #000000;
            color: #f1f5f9;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Subtle Ambient Glow */
        .bg-blob {
            position: fixed;
            top: -150px;
            right: -100px;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.05) 0%, rgba(0, 0, 0, 0) 70%);
            z-index: 0;
            pointer-events: none;
        }

        /* Sleek Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #1b2333;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #2a364f;
        }

        /* Collapse Animation */
        .collapsible-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.4s ease;
            opacity: 0;
        }
        
        .collapsible-content.expanded {
            opacity: 1;
        }

        /* Clean Tree Connector Lines */
        .tree-container {
            position: relative;
            margin-bottom: 1.5rem;
        }
        
        .tree-line {
            position: absolute;
            left: 27px; 
            top: 12px;
            bottom: 32px;
            width: 1px;
            background: linear-gradient(to bottom, #2a364f 0%, #1b2333 80%, transparent 100%);
            z-index: 0;
        }

        .tree-node-connector {
            position: absolute;
            left: -27px;
            top: 30px;
            width: 18px;
            height: 1px;
            background-color: #2a364f;
        }

        /* Professional Checkbox */
        .premium-checkbox {
            appearance: none;
            width: 22px;
            height: 22px;
            border: 2px solid #2a364f;
            border-radius: 6px;
            outline: none;
            cursor: pointer;
            position: relative;
            transition: all 0.2s ease;
            flex-shrink: 0;
            background-color: #05080f;
        }

        .premium-checkbox:hover {
            border-color: #3b82f6;
            background-color: rgba(59, 130, 246, 0.05);
        }

        .premium-checkbox:checked {
            background-color: #3b82f6;
            border-color: #3b82f6;
        }

        .premium-checkbox:checked::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 7px;
            width: 5px;
            height: 10px;
            border: solid #ffffff;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        .premium-checkbox.partial {
            background-color: rgba(59, 130, 246, 0.15);
            border-color: #3b82f6;
        }
        
        .premium-checkbox.partial::after {
            content: '';
            position: absolute;
            top: 8px;
            left: 5px;
            width: 8px;
            height: 2px;
            background-color: #3b82f6;
            border-radius: 2px;
        }

        /* Card with professional elevation */
        .card-pro {
            background-color: #090d16;
            border: 1px solid #1b2333;
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.015);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .card-pro:hover {
            border-color: #2a364f;
            box-shadow: 0 8px 30px -4px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(59, 130, 246, 0.1);
        }

        .card-scene {
            background-color: #070a12;
            border: 1px solid #161f30;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
            transition: all 0.25s ease;
        }
        .card-scene:hover {
            border-color: #22304a;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col font-sans relative overflow-x-hidden">
    
    <div class="bg-blob"></div>

    <!-- Top Navigation Bar -->
    <header class="fixed top-0 w-full bg-ui-bg/85 backdrop-blur-xl border-b border-ui-border z-40">
        <div class="max-w-4xl mx-auto px-5 h-20 flex items-center justify-between relative z-10">
            <div class="flex items-center gap-3.5">
                <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-white shadow-lg shadow-blue-500/20">
                    <i class="ph-bold ph-film-strip text-xl"></i>
                </div>
                <div>
                    <h1 class="text-sm font-bold tracking-tight text-ui-text">Storyboard Loader</h1>
                    <p class="text-[11px] font-medium text-ui-muted">Professional Video Script Manager</p>
                </div>
            </div>
            
            <div id="headerControls" class="flex items-center gap-4 hidden">
                <div class="flex flex-col items-end gap-1">
                    <span id="progressText" class="text-[11px] font-bold text-ui-text bg-ui-card px-3 py-1 rounded-full border border-ui-border shadow-sm">0/0 Selesai</span>
                    <div class="w-28 h-1 bg-ui-border rounded-full overflow-hidden">
                        <div id="progressBar" class="h-full bg-blue-500 transition-all duration-500 ease-out rounded-full w-0"></div>
                    </div>
                </div>
                <div class="w-px h-6 bg-ui-border mx-0.5"></div>
                <button id="btnReset" class="w-9 h-9 rounded-xl flex items-center justify-center text-ui-muted bg-ui-card border border-ui-border hover:text-red-400 hover:border-red-500/40 hover:bg-red-500/10 transition-all shadow-sm" title="Reset Project">
                    <i class="ph ph-trash text-lg"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow pt-24 pb-20 px-5 max-w-4xl mx-auto w-full relative z-10">
        
        <div id="uploadState" class="flex flex-col items-center justify-center h-[70vh] text-center">
            <div class="w-24 h-24 card-pro rounded-3xl flex items-center justify-center mb-6 relative group transition-all duration-300 hover:border-blue-500/40">
                <div class="absolute inset-0 bg-blue-500/5 rounded-3xl opacity-0 group-hover:opacity-100 transition-opacity"></div>
                <i class="ph-light ph-file-md text-4xl text-ui-muted group-hover:text-blue-500 transition-colors relative z-10"></i>
            </div>
            <label for="fileInput" class="bg-blue-600 hover:bg-blue-500 text-white px-7 py-3 rounded-xl text-xs font-semibold tracking-wide transition-all shadow-lg shadow-blue-600/20 cursor-pointer flex items-center gap-2.5">
                <i class="ph-bold ph-upload-simple text-base"></i>
                Buka File Markdown (.md)
            </label>
            <input type="file" id="fileInput" accept=".md" class="hidden">
        </div>

        <!-- Project Content View -->
        <div id="contentState" class="hidden flex flex-col mt-2">
            <!-- Dynamically populated script tree -->
        </div>

    </main>

    <div id="resetModal" class="fixed inset-0 z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-300">
        <div class="absolute inset-0 bg-black/80 backdrop-blur-sm" id="modalBackdrop"></div>
        <div class="relative card-pro rounded-2xl p-6 max-w-sm w-full mx-4 transform scale-95 transition-transform duration-300" id="modalContent">
            <div class="w-12 h-12 rounded-xl bg-red-500/10 flex items-center justify-center mb-4 text-red-400 border border-red-500/20">
                <i class="ph-fill ph-warning-circle text-2xl"></i>
            </div>
            <h3 class="text-sm font-bold text-ui-text mb-1">Reset Semua Progres?</h3>
            <p class="text-ui-muted text-xs mb-6 leading-relaxed">
                Tindakan ini akan menghapus seluruh data skrip dan status centang yang tersimpan.
            </p>
            <div class="flex items-center gap-3">
                <button id="btnCancelReset" class="flex-1 py-2.5 rounded-xl text-xs font-semibold bg-ui-card text-ui-muted hover:bg-ui-border border border-ui-border transition-colors">Batal</button>
                <button id="btnConfirmReset" class="flex-1 py-2.5 rounded-xl text-xs font-semibold bg-red-600 text-white hover:bg-red-500 transition-colors shadow-lg shadow-red-500/20">Hapus & Reset</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-8 left-1/2 transform -translate-x-1/2 translate-y-10 opacity-0 bg-ui-text text-ui-bg px-4 py-2.5 rounded-xl shadow-2xl flex items-center gap-2.5 transition-all duration-300 z-50 pointer-events-none font-sans">
        <i class="ph-bold ph-check text-blue-600 text-sm"></i>
        <span class="text-xs font-bold tracking-wide" id="toastMsg">Tersalin ke Clipboard</span>
    </div>

    <script>
        let appData = {
            scripts: [],
            totalScenes: 0,
            completedScenes: 0
        };

        const els = {
            uploadState: document.getElementById('uploadState'),
            contentState: document.getElementById('contentState'),
            fileInput: document.getElementById('fileInput'),
            headerControls: document.getElementById('headerControls'),
            progressText: document.getElementById('progressText'),
            progressBar: document.getElementById('progressBar'),
            btnReset: document.getElementById('btnReset'),
            resetModal: document.getElementById('resetModal'),
            modalBackdrop: document.getElementById('modalBackdrop'),
            modalContent: document.getElementById('modalContent'),
            btnCancelReset: document.getElementById('btnCancelReset'),
            btnConfirmReset: document.getElementById('btnConfirmReset'),
            toast: document.getElementById('toast')
        };

        function init() {
            loadFromStorage();
            if (appData.scripts.length > 0) {
                renderApp();
            }
            setupEventListeners();
        }

        function loadFromStorage() {
            const saved = localStorage.getItem('storyboardData_v6'); 
            if (saved) {
                try {
                    appData = JSON.parse(saved);
                } catch(e) {
                    console.error("Failed to parse local storage", e);
                }
            }
        }

        function saveToStorage() {
            localStorage.setItem('storyboardData_v6', JSON.stringify(appData));
        }

        function setupEventListeners() {
            els.fileInput.addEventListener('change', handleFileUpload);
            els.btnReset.addEventListener('click', showModal);
            els.btnCancelReset.addEventListener('click', hideModal);
            els.modalBackdrop.addEventListener('click', hideModal);
            els.btnConfirmReset.addEventListener('click', confirmReset);
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                parseMarkdown(e.target.result);
            };
            reader.readAsText(file);
        }

        function parseMarkdown(text) {
            let mainContent = text;
            const stopKeywords = ["RINGKASAN CREDIT", "CATATAN NASKAH"];
            for (let keyword of stopKeywords) {
                if (mainContent.includes(keyword)) {
                    mainContent = mainContent.split(keyword)[0];
                }
            }

            const scriptBlocks = mainContent.split(/(?:^|\n)SKRIP\s+/).filter(block => block.trim() !== "");
            
            let parsedScripts = [];
            let totalScenesCount = 0;

            scriptBlocks.forEach((block, scriptIndex) => {
                let lines = block.trim().split('\n');
                let rawTitleStr = lines[0].trim(); 
                
                let titleMatch = rawTitleStr.match(/^(\d+)/);
                let titleStr = titleMatch ? titleMatch[1] : rawTitleStr.replace(/\s*\(.*?\)\s*/g, '');
                
                let terjemahanText = "";
                const terjemahanMatch = block.match(/TERJEMAHAN:\s*([\s\S]*?)(?=VISUAL BREAKDOWN:|$)/i);
                if (terjemahanMatch) {
                    terjemahanText = terjemahanMatch[1].trim();
                }

                const sceneBlocks = block.split(/(?:^|\n)SCENE\s+/).filter((_, i) => i > 0); 
                let parsedScenes = [];

                sceneBlocks.forEach((sBlock, sceneIndex) => {
                    let sLines = sBlock.trim().split('\n');
                    let sTitleStr = sLines[0].trim().replace(/^[-_]+.*$/, '').trim(); 
                    
                    const extractField = (fieldName) => {
                        const regex = new RegExp(fieldName + ':\\s*(".*?"|.*?)(?:\\n|$)', 'i');
                        const match = sBlock.match(regex);
                        if (match) {
                            return match[1].replace(/^"|"$/g, '').trim();
                        }
                        return "";
                    };

                    const extractPrompt = () => {
                        const regex = /Prompt AI:\s*("[\s\S]*?"|[\s\S]*?)(?=\nSCENE|\n---|$)/i;
                        const match = sBlock.match(regex);
                        if (match) return match[1].replace(/^"|"$/g, '').trim();
                        return "";
                    };

                    let scriptText = extractField("Script");
                    let sceneTerjemahanText = extractField("Terjemahan");
                    let visualType = extractField("Visual");
                    let duration = extractField("Durasi Narasi");
                    let durasiGenerate = extractField("Durasi Generate");
                    let keywords = extractField("Kata Kunci Pencarian") || extractField("Kata Kunci Gambar") || extractField("Kata Kunci Visual");
                    let prompt = extractPrompt();
                    let overlayText = extractField("Teks");
                    let judul = extractField("Judul");
                    let subtitle = extractField("Subtitle");

                    let iconType = 'ph-video-camera'; 
                    if(visualType.toLowerCase().includes('history') || visualType.toLowerCase().includes('mechanic')) {
                        iconType = 'ph-image';
                    } else if(visualType.toLowerCase().includes('third') || overlayText !== "" || judul !== "") {
                        iconType = 'ph-subtitles';
                    } else if(prompt !== "") {
                        iconType = 'ph-sparkle';
                    }

                    parsedScenes.push({
                        id: `s${scriptIndex}-c${sceneIndex}`,
                        title: "SCENE " + sTitleStr,
                        scriptText: scriptText,
                        terjemahanText: sceneTerjemahanText,
                        visualType: visualType,
                        icon: iconType,
                        duration: duration,
                        durasiGenerate: durasiGenerate,
                        keywords: keywords,
                        prompt: prompt,
                        overlayText: overlayText,
                        judul: judul,
                        subtitle: subtitle,
                        completed: false
                    });

                    totalScenesCount++;
                });

                parsedScripts.push({
                    id: `script-${scriptIndex}`,
                    title: "SKRIP " + titleStr,
                    terjemahan: terjemahanText,
                    scenes: parsedScenes,
                    completed: false,
                    expanded: false 
                });
            });

            appData = {
                scripts: parsedScripts,
                totalScenes: totalScenesCount,
                completedScenes: 0
            };

            saveToStorage();
            renderApp();
        }

        function renderApp() {
            els.uploadState.classList.add('hidden');
            els.contentState.classList.remove('hidden');
            els.headerControls.classList.remove('hidden');

            updateProgress();
            els.contentState.innerHTML = '';

            appData.scripts.forEach((script, sIndex) => {
                const scenesCompleted = script.scenes.filter(s => s.completed).length;
                const isPartial = scenesCompleted > 0 && scenesCompleted < script.scenes.length;
                const isCompleted = scenesCompleted === script.scenes.length && script.scenes.length > 0;
                script.completed = isCompleted;

                const scriptWrapper = document.createElement('div');
                scriptWrapper.className = 'tree-container';

                const header = document.createElement('div');
                header.className = 'card-pro rounded-2xl p-4 md:p-5 flex items-start md:items-center gap-4 relative z-10';
                
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.id = `script-cb-${sIndex}`;
                checkbox.className = `premium-checkbox mt-0.5 md:mt-0 ${isPartial ? 'partial' : ''}`;
                checkbox.checked = isCompleted;
                checkbox.onclick = (e) => {
                    e.stopPropagation();
                    toggleScriptComplete(sIndex, e.target.checked);
                };

                const headerContent = document.createElement('div');
                headerContent.className = 'flex-grow cursor-pointer select-none';
                headerContent.onclick = () => toggleScriptExpand(sIndex);
                
                headerContent.innerHTML = `
                    <div class="flex flex-col md:flex-row md:items-center justify-between gap-2 md:gap-4">
                        <div class="flex-grow">
                            <h2 class="text-xs font-bold text-ui-text tracking-wide mb-1 uppercase">${script.title}</h2>
                            <p class="text-xs text-ui-muted leading-relaxed line-clamp-2 md:line-clamp-1 pr-4 font-normal">${script.terjemahan}</p>
                        </div>
                        <div class="flex items-center gap-3 flex-shrink-0 mt-1 md:mt-0">
                            <div class="flex items-center gap-2 text-ui-muted text-[11px] font-medium bg-[#05080f] px-3 py-1.5 rounded-xl border border-ui-border">
                                <span id="script-progress-${sIndex}">${scenesCompleted}/${script.scenes.length}</span>
                                <i class="ph-bold ph-caret-down transition-transform duration-300 ${script.expanded ? 'transform rotate-180 text-blue-500' : ''}"></i>
                            </div>
                        </div>
                    </div>
                `;

                header.appendChild(checkbox);
                header.appendChild(headerContent);
                scriptWrapper.appendChild(header);

                const childrenContainer = document.createElement('div');
                childrenContainer.className = `collapsible-content ${script.expanded ? 'expanded' : ''}`;
                childrenContainer.id = `content-${script.id}`;
                
                const innerWrapper = document.createElement('div');
                innerWrapper.className = 'pt-4 pb-2 pl-[48px] relative flex flex-col gap-3.5';
                
                if (script.scenes.length > 0) {
                    const line = document.createElement('div');
                    line.className = 'tree-line';
                    innerWrapper.appendChild(line);
                }

                script.scenes.forEach((scene, cIndex) => {
                    const sceneCard = document.createElement('div');
                    sceneCard.id = `scene-card-${sIndex}-${cIndex}`;
                    const completionStyles = scene.completed ? 'opacity-40 grayscale-[25%]' : 'opacity-100 grayscale-0';
                    sceneCard.className = `card-scene rounded-xl p-4 md:p-5 flex items-start gap-3.5 relative transition-all duration-300 ${completionStyles}`;
                    
                    const connector = document.createElement('div');
                    connector.className = 'tree-node-connector';
                    sceneCard.appendChild(connector);

                    const sCheckbox = document.createElement('input');
                    sCheckbox.type = 'checkbox';
                    sCheckbox.id = `scene-cb-${sIndex}-${cIndex}`;
                    sCheckbox.className = 'premium-checkbox mt-0.5';
                    sCheckbox.checked = scene.completed;
                    sCheckbox.onclick = () => toggleSceneComplete(sIndex, cIndex);

                    const sContent = document.createElement('div');
                    sContent.className = 'flex-grow min-w-0'; 
                    
                    let metaHTML = `<div class="flex flex-wrap items-center gap-2 mb-3.5 text-[10px] font-semibold tracking-wider uppercase">`;
                    if(scene.visualType) {
                        metaHTML += `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-blue-500/10 text-blue-400 border border-blue-500/20"><i class="ph-bold ${scene.icon}"></i> ${scene.visualType}</span>`;
                    }
                    if(scene.duration) {
                        metaHTML += `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-[#04060b] text-slate-300 border border-ui-border"><i class="ph-bold ph-clock"></i> Narasi: ${scene.duration}</span>`;
                    }
                    if(scene.durasiGenerate) {
                        metaHTML += `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-[#04060b] text-slate-300 border border-ui-border"><i class="ph-bold ph-hourglass-high"></i> Gen: ${scene.durasiGenerate}</span>`;
                    }
                    metaHTML += `</div>`;

                    let textsHTML = '';
                    if (scene.scriptText) {
                        textsHTML += `
                            <div class="mb-3">
                                <span class="text-[9px] font-bold uppercase tracking-wider text-ui-muted mb-1 block">Script Asli (Inggris)</span>
                                <p class="text-xs text-slate-200 leading-relaxed font-normal">"${scene.scriptText}"</p>
                            </div>
                        `;
                    }
                    if (scene.terjemahanText) {
                        textsHTML += `
                            <div class="mb-4">
                                <span class="text-[9px] font-bold uppercase tracking-wider text-ui-muted mb-1 block">Terjemahan Indonesia</span>
                                <p class="text-xs text-slate-400 leading-relaxed italic">"${scene.terjemahanText}"</p>
                            </div>
                        `;
                    }

                    let actionsHTML = '<div class="flex flex-col gap-2.5 mt-3">';
                    
                    if (scene.judul || scene.subtitle || scene.overlayText) {
                         actionsHTML += `<div class="bg-[#04060b] rounded-lg p-3 border border-ui-border">`;
                         if (scene.judul) actionsHTML += `<div class="mb-2"><span class="text-[9px] font-bold uppercase tracking-wider text-ui-muted mb-0.5 block">Judul</span><p class="text-xs font-semibold text-blue-400">${scene.judul}</p></div>`;
                         if (scene.subtitle) actionsHTML += `<div class="mb-2"><span class="text-[9px] font-bold uppercase tracking-wider text-ui-muted mb-0.5 block">Subtitle</span><p class="text-xs text-slate-300">${scene.subtitle}</p></div>`;
                         if (scene.overlayText) actionsHTML += `<div><span class="text-[9px] font-bold uppercase tracking-wider text-ui-muted mb-0.5 block">Overlay Text</span><p class="text-xs font-semibold text-blue-400">${scene.overlayText}</p></div>`;
                         actionsHTML += `</div>`;
                    }

                    if (scene.prompt) {
                        actionsHTML += `
                            <div class="bg-[#04060b] rounded-lg p-3 border border-ui-border relative group">
                                <span class="text-[9px] font-bold uppercase tracking-wider text-ui-muted mb-1.5 block">AI Prompt</span>
                                <p class="text-xs text-slate-300 leading-relaxed pr-8 break-words line-clamp-2 group-hover:line-clamp-none transition-all font-mono">${scene.prompt}</p>
                                <button onclick="doCopy(${sIndex}, ${cIndex}, 'prompt')" class="absolute top-2.5 right-2.5 w-7 h-7 rounded-md bg-ui-card hover:bg-blue-600 flex items-center justify-center text-blue-400 hover:text-white transition-colors border border-ui-border shadow-sm" title="Salin Prompt">
                                    <i class="ph-bold ph-copy text-xs"></i>
                                </button>
                            </div>
                        `;
                    }
                    if (scene.keywords) {
                        actionsHTML += `
                            <div class="bg-[#04060b] rounded-lg p-3 border border-ui-border relative group">
                                <span class="text-[9px] font-bold uppercase tracking-wider text-ui-muted mb-1.5 block">Keywords</span>
                                <p class="text-xs font-medium text-slate-300 leading-relaxed pr-8 font-mono">${scene.keywords}</p>
                                <button onclick="doCopy(${sIndex}, ${cIndex}, 'keywords')" class="absolute top-2.5 right-2.5 w-7 h-7 rounded-md bg-ui-card hover:bg-blue-600 flex items-center justify-center text-blue-400 hover:text-white transition-colors border border-ui-border shadow-sm" title="Salin Keywords">
                                    <i class="ph-bold ph-copy text-xs"></i>
                                </button>
                            </div>
                        `;
                    }
                    actionsHTML += '</div>';

                    sContent.innerHTML = `
                        <h3 class="text-xs font-bold text-ui-text mb-2.5 tracking-wide">${scene.title}</h3>
                        ${metaHTML}
                        ${textsHTML}
                        ${actionsHTML}
                    `;

                    sceneCard.appendChild(sCheckbox);
                    sceneCard.appendChild(sContent);
                    innerWrapper.appendChild(sceneCard);
                });

                childrenContainer.appendChild(innerWrapper);
                scriptWrapper.appendChild(childrenContainer);
                els.contentState.appendChild(scriptWrapper);

                if (script.expanded) {
                    setTimeout(() => {
                        childrenContainer.style.maxHeight = childrenContainer.scrollHeight + 'px';
                    }, 10); 
                }
            });
        }

        function toggleScriptExpand(sIndex) {
            const script = appData.scripts[sIndex];
            script.expanded = !script.expanded;
            
            const container = document.getElementById(`content-${script.id}`);
            const chevron = container.previousElementSibling.querySelector('.ph-caret-down');

            if (script.expanded) {
                container.classList.add('expanded');
                chevron.classList.add('transform', 'rotate-180', 'text-blue-500');
                container.style.maxHeight = container.scrollHeight + 'px';
                setTimeout(() => { container.style.maxHeight = 'none'; }, 400);
            } else {
                container.style.maxHeight = container.scrollHeight + 'px';
                container.offsetHeight;
                container.classList.remove('expanded');
                chevron.classList.remove('transform', 'rotate-180', 'text-blue-500');
                container.style.maxHeight = '0px';
            }
            saveToStorage();
        }

        function applySceneCardStyle(sIndex, cIndex, isCompleted) {
            const sceneCard = document.getElementById(`scene-card-${sIndex}-${cIndex}`);
            if (sceneCard) {
                if (isCompleted) {
                    sceneCard.classList.add('opacity-40', 'grayscale-[25%]');
                    sceneCard.classList.remove('opacity-100', 'grayscale-0');
                } else {
                    sceneCard.classList.remove('opacity-40', 'grayscale-[25%]');
                    sceneCard.classList.add('opacity-100', 'grayscale-0');
                }
            }
        }

        function toggleSceneComplete(sIndex, cIndex) {
            const script = appData.scripts[sIndex];
            const scene = script.scenes[cIndex];
            scene.completed = !scene.completed;
            
            const scenesCompleted = script.scenes.filter(s => s.completed).length;
            const isPartial = scenesCompleted > 0 && scenesCompleted < script.scenes.length;
            const isCompleted = scenesCompleted === script.scenes.length && script.scenes.length > 0;
            script.completed = isCompleted;

            saveToStorage();
            
            applySceneCardStyle(sIndex, cIndex, scene.completed);

            const scriptCheckbox = document.getElementById(`script-cb-${sIndex}`);
            if (scriptCheckbox) {
                scriptCheckbox.checked = isCompleted;
                if (isPartial) scriptCheckbox.classList.add('partial');
                else scriptCheckbox.classList.remove('partial');
            }

            const scriptProgress = document.getElementById(`script-progress-${sIndex}`);
            if (scriptProgress) {
                scriptProgress.innerText = `${scenesCompleted}/${script.scenes.length}`;
            }

            updateProgress();
        }

        function toggleScriptComplete(sIndex, forceState) {
            const script = appData.scripts[sIndex];
            script.completed = forceState;
            script.scenes.forEach(scene => scene.completed = forceState);
            
            saveToStorage();
            
            const scriptCheckbox = document.getElementById(`script-cb-${sIndex}`);
            if (scriptCheckbox) {
                scriptCheckbox.checked = forceState;
                scriptCheckbox.classList.remove('partial');
            }

            const scriptProgress = document.getElementById(`script-progress-${sIndex}`);
            if (scriptProgress) {
                scriptProgress.innerText = forceState ? `${script.scenes.length}/${script.scenes.length}` : `0/${script.scenes.length}`;
            }

            script.scenes.forEach((scene, cIndex) => {
                const childCb = document.getElementById(`scene-cb-${sIndex}-${cIndex}`);
                if (childCb) childCb.checked = forceState;
                applySceneCardStyle(sIndex, cIndex, forceState);
            });

            updateProgress();
        }

        function updateProgress() {
            let completed = 0;
            appData.scripts.forEach(script => {
                completed += script.scenes.filter(s => s.completed).length;
            });
            appData.completedScenes = completed;

            els.progressText.innerText = `${completed}/${appData.totalScenes} Selesai`;
            const percentage = appData.totalScenes === 0 ? 0 : (completed / appData.totalScenes) * 100;
            els.progressBar.style.width = `${percentage}%`;
        }

        window.doCopy = function(sIndex, cIndex, type) {
            let text = "";
            if (type === 'prompt') text = appData.scripts[sIndex].scenes[cIndex].prompt;
            else if (type === 'keywords') text = appData.scripts[sIndex].scenes[cIndex].keywords;
            copyToClipboard(text);
        };

        function copyToClipboard(text) {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(showToast).catch(() => fallbackCopy(text));
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                showToast();
            } catch (err) {
                console.error('Copy failed', err);
            }
            document.body.removeChild(textArea);
        }

        let toastTimeout;
        function showToast() {
            els.toast.classList.remove('opacity-0', 'translate-y-10');
            els.toast.classList.add('opacity-100', 'translate-y-0');
            
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                els.toast.classList.remove('opacity-100', 'translate-y-0');
                els.toast.classList.add('opacity-0', 'translate-y-10');
            }, 2500);
        }

        function showModal() {
            els.resetModal.classList.remove('hidden');
            setTimeout(() => {
                els.resetModal.classList.remove('opacity-0');
                els.modalContent.classList.remove('scale-95');
                els.modalContent.classList.add('scale-100');
            }, 10);
        }

        function hideModal() {
            els.resetModal.classList.add('opacity-0');
            els.modalContent.classList.remove('scale-100');
            els.modalContent.classList.add('scale-95');
            setTimeout(() => {
                els.resetModal.classList.add('hidden');
            }, 300);
        }

        function confirmReset() {
            appData = { scripts: [], totalScenes: 0, completedScenes: 0 };
            localStorage.removeItem('storyboardData_v6');
            els.fileInput.value = '';
            hideModal();
            els.contentState.classList.add('hidden');
            els.headerControls.classList.add('hidden');
            els.uploadState.classList.remove('hidden');
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
